<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BNIX Webmail - Admin</title>
  <link rel="icon" href="/brand/mail.png">
  <style>
    :root {
      --primary: #284f7d;
      --primary-light: #3d83bd;
      --bg: #f8fafc;
      --card: #fff;
      --border: #e2e8f0;
      --text: #1e293b;
      --text-muted: #64748b;
      --danger: #dc2626;
      --danger-bg: #fef2f2;
      --success: #16a34a;
      --success-bg: #f0fdf4;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
    }

    /* ─── Header ─────────────────────────────────────────────────────────── */
    .header {
      background: linear-gradient(135deg, var(--primary), var(--primary-light));
      color: #fff;
      padding: 16px 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    }
    .header h1 { font-size: 18px; font-weight: 600; letter-spacing: 0.5px; }
    .header-right { display: flex; align-items: center; gap: 12px; }
    .header-user { font-size: 13px; opacity: 0.9; }
    .btn-logout {
      background: rgba(255,255,255,0.15);
      border: 1px solid rgba(255,255,255,0.3);
      color: #fff;
      padding: 6px 14px;
      border-radius: 6px;
      font-size: 13px;
      cursor: pointer;
      transition: background 0.15s;
    }
    .btn-logout:hover { background: rgba(255,255,255,0.25); }

    /* ─── Layout ─────────────────────────────────────────────────────────── */
    .container {
      max-width: 800px;
      margin: 24px auto;
      padding: 0 16px;
    }

    /* ─── Login ──────────────────────────────────────────────────────────── */
    .login-wrapper {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      background: var(--bg);
    }
    .login-card {
      background: var(--card);
      border-radius: 12px;
      box-shadow: 0 4px 24px rgba(0,0,0,0.08);
      padding: 32px;
      width: 100%;
      max-width: 380px;
    }
    .login-card h2 {
      font-size: 20px;
      margin-bottom: 4px;
      color: var(--primary);
    }
    .login-card p {
      font-size: 13px;
      color: var(--text-muted);
      margin-bottom: 24px;
    }

    /* ─── Forms ──────────────────────────────────────────────────────────── */
    .form-group { margin-bottom: 14px; }
    .form-group label {
      display: block;
      font-size: 12px;
      font-weight: 600;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 5px;
    }
    .form-group input, .form-group select {
      width: 100%;
      padding: 10px 12px;
      border: 1.5px solid var(--border);
      border-radius: 8px;
      font-size: 14px;
      color: var(--text);
      background: #fff;
      outline: none;
      transition: border-color 0.15s, box-shadow 0.15s;
    }
    .form-group input:focus, .form-group select:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(40,79,125,0.1);
    }
    .form-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }
    .form-hint {
      color: var(--text-muted);
      font-size: 12px;
      line-height: 1.5;
      margin-top: -6px;
      margin-bottom: 14px;
    }
    .toggle-row {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 14px;
      font-weight: 600;
      margin-bottom: 16px;
      color: var(--text);
      cursor: pointer;
    }
    .toggle-row input {
      width: 18px;
      height: 18px;
      accent-color: var(--primary);
    }

    /* ─── Buttons ────────────────────────────────────────────────────────── */
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      padding: 10px 18px;
      border: none;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: opacity 0.15s, transform 0.1s;
    }
    .btn:hover { opacity: 0.9; }
    .btn:active { transform: scale(0.98); }
    .btn-primary {
      background: linear-gradient(135deg, var(--primary), var(--primary-light));
      color: #fff;
      box-shadow: 0 2px 8px rgba(40,79,125,0.3);
    }
    .btn-danger {
      background: var(--danger);
      color: #fff;
    }
    .btn-sm { padding: 6px 12px; font-size: 13px; }
    .btn-block { width: 100%; }
    .btn-icon {
      width: 32px;
      height: 32px;
      padding: 0;
      border-radius: 6px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }

    /* ─── Cards ──────────────────────────────────────────────────────────── */
    .card {
      background: var(--card);
      border-radius: 12px;
      box-shadow: 0 1px 4px rgba(0,0,0,0.06);
      border: 1px solid var(--border);
      margin-bottom: 20px;
    }
    .card-header {
      padding: 16px 20px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .card-header h3 {
      font-size: 15px;
      font-weight: 600;
    }
    .card-body { padding: 20px; }

    /* ─── Alerts ─────────────────────────────────────────────────────────── */
    .alert {
      padding: 10px 14px;
      border-radius: 8px;
      font-size: 13px;
      margin-bottom: 14px;
      display: none;
    }
    .alert.show { display: block; }
    .alert-error { background: var(--danger-bg); color: var(--danger); border: 1px solid #fecaca; }
    .alert-success { background: var(--success-bg); color: var(--success); border: 1px solid #bbf7d0; }

    /* ─── Domain Table ───────────────────────────────────────────────────── */
    .domain-table {
      width: 100%;
      border-collapse: collapse;
    }
    .domain-table th, .domain-table td {
      padding: 10px 12px;
      text-align: left;
      border-bottom: 1px solid var(--border);
      font-size: 14px;
    }
    .domain-table th {
      font-size: 12px;
      font-weight: 600;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .domain-table tr:last-child td { border-bottom: none; }
    .domain-table .actions { text-align: right; white-space: nowrap; }
    .badge {
      display: inline-block;
      padding: 2px 8px;
      border-radius: 10px;
      font-size: 11px;
      font-weight: 600;
    }
    .badge-on { background: #dcfce7; color: #16a34a; }
    .badge-off { background: #f1f5f9; color: #94a3b8; }
    .empty-state {
      text-align: center;
      padding: 32px 16px;
      color: var(--text-muted);
      font-size: 14px;
    }

    /* ─── Add Domain Form ────────────────────────────────────────────────── */
    .add-domain-form {
      display: grid;
      grid-template-columns: 1fr 1fr auto;
      gap: 10px;
      align-items: end;
    }
    .add-domain-form .form-group { margin-bottom: 0; }
    .table-input {
      width: 100%;
      min-width: 150px;
      padding: 7px 9px;
      border: 1px solid var(--border);
      border-radius: 6px;
      font-size: 13px;
      color: var(--text);
      background: #fff;
    }
    .status-toggle {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      white-space: nowrap;
    }
    .status-toggle input { accent-color: var(--primary); }

    /* ─── Responsive ─────────────────────────────────────────────────────── */
    @media (max-width: 640px) {
      .header { padding: 12px 16px; }
      .header h1 { font-size: 16px; }
      .container { padding: 0 12px; }
      .form-row { grid-template-columns: 1fr; }
      .add-domain-form { grid-template-columns: 1fr; }
      .domain-table { font-size: 13px; }
      .domain-table th, .domain-table td { padding: 8px; }
      .s3-form-grid { grid-template-columns: 1fr; }
    }

    /* ─── S3 Config ─────────────────────────────────────────────────────── */
    .s3-form-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }
    .s3-form-grid .form-group.full-width {
      grid-column: 1 / -1;
    }
    .s3-card-item {
      background: #f8fafc;
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 14px;
      margin-bottom: 12px;
    }
    .s3-card-item .s3-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
    }
    .s3-card-item .s3-email {
      font-weight: 600;
      font-size: 14px;
      color: var(--primary);
    }
    .s3-card-item .s3-details {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      font-size: 13px;
      color: var(--text-muted);
    }
    .s3-card-item .s3-details span { color: var(--text); font-weight: 500; }
    .s3-actions { display: flex; gap: 6px; }
    .btn-xs {
      padding: 4px 10px;
      font-size: 12px;
      border-radius: 5px;
      border: 1px solid var(--border);
      cursor: pointer;
      transition: all 0.15s;
    }
    .btn-xs.btn-outline { background: #fff; color: var(--text); }
    .btn-xs.btn-outline:hover { background: var(--bg); }
    .btn-xs.btn-danger-outline { background: #fff; color: var(--danger); border-color: #fecaca; }
    .btn-xs.btn-danger-outline:hover { background: var(--danger-bg); }
  </style>
</head>
<body>

  <!-- Login Page -->
  <div id="loginPage" class="login-wrapper">
    <div class="login-card">
      <h2>🔐 Admin</h2>
      <p>BNIX Webmail Administration</p>
      <div id="loginAlert" class="alert alert-error"></div>
      <form id="loginForm">
        <div class="form-group">
          <label>Username</label>
          <input type="text" name="username" placeholder="admin" required autocomplete="username">
        </div>
        <div class="form-group">
          <label>Password</label>
          <input type="password" name="password" placeholder="••••••••" required autocomplete="current-password">
        </div>
        <button type="submit" class="btn btn-primary btn-block">Sign in</button>
      </form>
    </div>
  </div>

  <!-- Admin Dashboard -->
  <div id="adminDashboard" style="display:none;">
    <div class="header">
      <h1>⚙️ BNIX Webmail Admin</h1>
      <div class="header-right">
        <span class="header-user" id="adminUser"></span>
        <button class="btn-logout" onclick="adminLogout()">Đăng xuất</button>
      </div>
    </div>

    <div class="container">
      <!-- Alerts -->
      <div id="dashAlert" class="alert"></div>

      <!-- Domain Aliases -->
      <div class="card">
        <div class="card-header">
          <h3>🌐 Domain Aliases</h3>
        </div>
        <div class="card-body">
          <div class="add-domain-form" style="margin-bottom: 16px;">
            <div class="form-group">
              <label>Domain / Subdomain</label>
              <input type="text" id="newAliasDomain" placeholder="webmail.domain.com">
            </div>
            <div class="form-group">
              <label>Target mail domain (tùy chọn)</label>
              <input type="text" id="newTargetDomain" placeholder="Để trống để tự nhận dạng">
            </div>
            <button class="btn btn-primary btn-sm" onclick="addDomain()" style="margin-bottom: 0;">+ Thêm</button>
          </div>
          <table class="domain-table">
            <thead>
              <tr>
                <th>Domain</th>
                <th>Mail domain</th>
                <th>Status</th>
                <th class="actions">Actions</th>
              </tr>
            </thead>
            <tbody id="domainTableBody">
              <tr><td colspan="4" class="empty-state">Đang tải...</td></tr>
            </tbody>
          </table>
        </div>
      </div>

      <!-- S3 Storage Configuration -->
      <div class="card">
        <div class="card-header">
          <h3>☁️ S3 Storage — Email Attachments</h3>
        </div>
        <div class="card-body">
          <p style="font-size:13px; color:var(--text-muted); margin-bottom:16px;">
            Cấu hình S3 cho từng email. File đính kèm lớn hơn 22MB sẽ được tự động lưu lên S3 bucket.
          </p>
          <div id="s3Alert" class="alert"></div>

          <!-- Add new S3 config form -->
          <div id="s3FormWrapper" style="display:none; margin-bottom:16px;">
            <div class="s3-form-grid">
              <div class="form-group">
                <label>Email</label>
                <input type="email" id="s3Email" placeholder="user@domain.com">
              </div>
              <div class="form-group">
                <label>Bucket</label>
                <input type="text" id="s3Bucket" placeholder="my-mail-attachments">
              </div>
              <div class="form-group">
                <label>Region</label>
                <input type="text" id="s3Region" value="us-east-1" placeholder="us-east-1">
              </div>
              <div class="form-group">
                <label>Endpoint URL (tùy chọn)</label>
                <input type="text" id="s3Endpoint" placeholder="https://s3.amazonaws.com">
              </div>
              <div class="form-group">
                <label>Access Key</label>
                <input type="text" id="s3AccessKey" placeholder="AKIA...">
              </div>
              <div class="form-group">
                <label>Secret Key</label>
                <input type="password" id="s3SecretKey" placeholder="••••••••">
              </div>
              <div class="form-group">
                <label>Prefix (tùy chọn)</label>
                <input type="text" id="s3Prefix" placeholder="webmail-attachments/">
              </div>
              <div class="form-group" style="display:flex; align-items:flex-end;">
                <button class="btn btn-primary btn-sm" onclick="saveS3Config()">💾 Lưu cấu hình</button>
                <button class="btn btn-sm" onclick="toggleS3Form()" style="margin-left:8px;">Hủy</button>
              </div>
            </div>
          </div>

          <button id="btnAddS3" class="btn btn-primary btn-sm" onclick="toggleS3Form()" style="margin-bottom:12px;">+ Thêm S3 Config</button>

          <div id="s3ConfigList">
            <div class="empty-state">Đang tải...</div>
          </div>
        </div>
      </div>

      <!-- Change Password -->
      <div class="card">
        <div class="card-header">
          <h3>🔑 Đổi mật khẩu</h3>
        </div>
        <div class="card-body">
          <div id="pwAlert" class="alert"></div>
          <form id="passwordForm" onsubmit="changePassword(event)">
            <div class="form-row">
              <div class="form-group">
                <label>Mật khẩu hiện tại</label>
                <input type="password" name="oldPassword" required>
              </div>
              <div class="form-group">
                <label>Mật khẩu mới</label>
                <input type="password" name="newPassword" required minlength="6">
              </div>
            </div>
            <button type="submit" class="btn btn-primary btn-sm">Cập nhật mật khẩu</button>
          </form>
        </div>
      </div>
    </div>
  </div>

<script>
// ─── State ──────────────────────────────────────────────────────────────────
let adminUser = null;

// ─── API Helper ─────────────────────────────────────────────────────────────
async function api(url, opts = {}) {
  const res = await fetch(url, {
    headers: { 'Content-Type': 'application/json' },
    credentials: 'same-origin',
    ...opts,
  });
  const data = await res.json();
  if (!res.ok) {
    const detail = data.detail;
    const err = new Error(
      detail && typeof detail === 'object'
        ? (detail.message || 'Request failed')
        : (detail || 'Request failed')
    );
    err.status = res.status;
    if (detail && typeof detail === 'object') Object.assign(err, detail);
    throw err;
  }
  return data;
}

// ─── Alerts ─────────────────────────────────────────────────────────────────
function showAlert(id, msg, type = 'error') {
  const el = document.getElementById(id);
  el.className = `alert alert-${type} show`;
  el.textContent = msg;
  setTimeout(() => el.classList.remove('show'), 4000);
}

// ─── Auth ───────────────────────────────────────────────────────────────────
async function checkAuth() {
  try {
    const data = await api('/api/admin/me');
    if (data.authenticated) {
      adminUser = data.username;
      showDashboard();
    } else {
      showLogin();
    }
  } catch {
    showLogin();
  }
}

function showLogin() {
  document.getElementById('loginPage').style.display = 'flex';
  document.getElementById('adminDashboard').style.display = 'none';
}

function showDashboard() {
  document.getElementById('loginPage').style.display = 'none';
  document.getElementById('adminDashboard').style.display = 'block';
  document.getElementById('adminUser').textContent = adminUser;
  loadDomains();
  loadS3Configs();
}

document.getElementById('loginForm').onsubmit = async (e) => {
  e.preventDefault();
  const form = e.target;
  try {
    const data = await api('/api/admin/login', {
      method: 'POST',
      body: JSON.stringify({
        username: form.username.value.trim(),
        password: form.password.value,
      }),
    });
    adminUser = data.username;
    showDashboard();
  } catch (err) {
    if (err.code === 'LOGIN_TEMPORARILY_LOCKED') {
      const minutes = Math.max(1, Math.ceil((err.retryAfter || 900) / 60));
      showAlert(
        'loginAlert',
        `Đăng nhập tạm khóa do nhập sai quá nhiều lần. Vui lòng thử lại sau ${minutes} phút.`
      );
    } else if (err.code === 'INVALID_CREDENTIALS') {
      showAlert(
        'loginAlert',
        `Tên đăng nhập hoặc mật khẩu không đúng. Còn ${err.remainingAttempts ?? 0} lần thử.`
      );
    } else {
      showAlert('loginAlert', err.message);
    }
  }
};

async function adminLogout() {
  await api('/api/admin/logout', { method: 'POST' });
  adminUser = null;
  showLogin();
}

// ─── Domains ────────────────────────────────────────────────────────────────
async function loadDomains() {
  try {
    const data = await api('/api/admin/domains');
    const tbody = document.getElementById('domainTableBody');
    if (!data.domains.length) {
      tbody.innerHTML = '<tr><td colspan="4" class="empty-state">No domain aliases yet</td></tr>';
      return;
    }
    tbody.innerHTML = data.domains.map(d => `
      <tr>
        <td><strong>${escHtml(d.aliasDomain)}</strong></td>
        <td>
          <input class="table-input" id="target-${d.id}" value="${escAttr(d.targetDomain || '')}" placeholder="Tùy chọn">
        </td>
        <td>
          <label class="status-toggle">
            <input type="checkbox" id="enabled-${d.id}" ${d.enabled ? 'checked' : ''}>
            <span class="badge ${d.enabled ? 'badge-on' : 'badge-off'}">${d.enabled ? 'Active' : 'Disabled'}</span>
          </label>
        </td>
        <td class="actions">
          <button class="btn btn-primary btn-icon btn-sm" onclick="updateDomain(${d.id})" title="Save">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/><path d="M17 21v-8H7v8"/><path d="M7 3v5h8"/></svg>
          </button>
          <button class="btn btn-danger btn-icon btn-sm" onclick="deleteDomain(${d.id})" title="Xóa">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18"/><path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"/><path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"/></svg>
          </button>
        </td>
      </tr>
    `).join('');
  } catch (err) {
    showAlert('dashAlert', 'Không thể tải domains: ' + err.message);
  }
}

async function addDomain() {
  const aliasDomain = document.getElementById('newAliasDomain').value.trim();
  const targetDomain = document.getElementById('newTargetDomain').value.trim();
  if (!aliasDomain) {
    showAlert('dashAlert', 'Vui lòng nhập domain');
    return;
  }
  try {
    await api('/api/admin/domains', {
      method: 'POST',
      body: JSON.stringify({ aliasDomain, targetDomain }),
    });
    document.getElementById('newAliasDomain').value = '';
    document.getElementById('newTargetDomain').value = '';
    showAlert('dashAlert', 'Đã thêm domain!', 'success');
    loadDomains();
  } catch (err) {
    showAlert('dashAlert', err.message);
  }
}

async function updateDomain(id) {
  const targetDomain = document.getElementById(`target-${id}`).value.trim();
  const enabled = document.getElementById(`enabled-${id}`).checked;
  try {
    await api(`/api/admin/domains/${id}`, {
      method: 'PUT',
      body: JSON.stringify({ targetDomain, enabled }),
    });
    showAlert('dashAlert', 'Domain alias updated', 'success');
    loadDomains();
  } catch (err) {
    showAlert('dashAlert', err.message);
  }
}

async function deleteDomain(id) {
  if (!confirm('Xóa domain alias này?')) return;
  try {
    await api(`/api/admin/domains/${id}`, { method: 'DELETE' });
    showAlert('dashAlert', 'Đã xóa domain alias', 'success');
    loadDomains();
  } catch (err) {
    showAlert('dashAlert', err.message);
  }
}

// ─── Password ───────────────────────────────────────────────────────────────
async function changePassword(e) {
  e.preventDefault();
  const form = e.target;
  try {
    await api('/api/admin/password', {
      method: 'PUT',
      body: JSON.stringify({
        oldPassword: form.oldPassword.value,
        newPassword: form.newPassword.value,
      }),
    });
    form.reset();
    showAlert('pwAlert', 'Đã cập nhật mật khẩu!', 'success');
  } catch (err) {
    showAlert('pwAlert', err.message);
  }
}

// ─── Utils ──────────────────────────────────────────────────────────────────
function escHtml(s) {
  const d = document.createElement('div');
  d.textContent = s || '';
  return d.innerHTML;
}

function escAttr(s) {
  return escHtml(s).replace(/`/g, '&#96;');
}

// ─── Init ───────────────────────────────────────────────────────────────────
checkAuth();
loadS3Configs();

// ─── S3 Config Management ───────────────────────────────────────────────────
let s3Configs = [];
let s3FormVisible = false;

function toggleS3Form() {
  s3FormVisible = !s3FormVisible;
  document.getElementById('s3FormWrapper').style.display = s3FormVisible ? 'block' : 'none';
  document.getElementById('btnAddS3').style.display = s3FormVisible ? 'none' : 'inline-block';
}

async function loadS3Configs() {
  try {
    const data = await api('/api/admin/s3-configs');
    s3Configs = data.configs || [];
    renderS3Configs();
  } catch (err) {
    document.getElementById('s3ConfigList').innerHTML =
      `<div class="empty-state">Lỗi tải cấu hình S3: ${escHtml(err.message)}</div>`;
  }
}

function renderS3Configs() {
  const container = document.getElementById('s3ConfigList');
  if (!s3Configs.length) {
    container.innerHTML = '<div class="empty-state">Chưa có cấu hình S3 nào</div>';
    return;
  }
  container.innerHTML = s3Configs.map(c => `
    <div class="s3-card-item">
      <div class="s3-header">
        <span class="s3-email">${escHtml(c.email)}</span>
        <div class="s3-actions">
          <span class="badge ${c.enabled ? 'badge-on' : 'badge-off'}">${c.enabled ? 'Active' : 'Disabled'}</span>
          <button class="btn-xs btn-outline" onclick="testS3Config(${c.id})" title="Test kết nối">🔌 Test</button>
          <button class="btn-xs btn-danger-outline" onclick="deleteS3Config(${c.id})" title="Xóa">🗑️</button>
        </div>
      </div>
      <div class="s3-details">
        <div>Bucket: <span>${escHtml(c.bucket)}</span></div>
        <div>Region: <span>${escHtml(c.region)}</span></div>
        <div>Endpoint: <span>${escHtml(c.endpointUrl || 'default')}</span></div>
        <div>Access Key: <span>${escHtml(c.accessKey)}</span></div>
        ${c.prefix ? `<div>Prefix: <span>${escHtml(c.prefix)}</span></div>` : ''}
      </div>
    </div>
  `).join('');
}

async function saveS3Config() {
  const email = document.getElementById('s3Email').value.trim();
  const bucket = document.getElementById('s3Bucket').value.trim();
  const region = document.getElementById('s3Region').value.trim() || 'us-east-1';
  const endpointUrl = document.getElementById('s3Endpoint').value.trim();
  const accessKey = document.getElementById('s3AccessKey').value.trim();
  const secretKey = document.getElementById('s3SecretKey').value;
  const prefix = document.getElementById('s3Prefix').value.trim();

  if (!email || !bucket || !accessKey || !secretKey) {
    showAlert('s3Alert', 'Vui lòng điền đầy đủ Email, Bucket, Access Key và Secret Key');
    return;
  }

  try {
    await api('/api/admin/s3-configs', {
      method: 'POST',
      body: JSON.stringify({ email, bucket, region, endpointUrl, accessKey, secretKey, prefix, enabled: true }),
    });
    showAlert('s3Alert', `Đã lưu cấu hình S3 cho ${email}`, 'success');
    // Clear form
    ['s3Email', 's3Bucket', 's3Endpoint', 's3AccessKey', 's3SecretKey', 's3Prefix'].forEach(id => document.getElementById(id).value = '');
    document.getElementById('s3Region').value = 'us-east-1';
    toggleS3Form();
    loadS3Configs();
  } catch (err) {
    showAlert('s3Alert', err.message);
  }
}

async function testS3Config(id) {
  try {
    const data = await api(`/api/admin/s3-configs/${id}/test`, { method: 'POST' });
    showAlert('s3Alert', data.message || 'Kết nối S3 thành công!', 'success');
  } catch (err) {
    showAlert('s3Alert', err.message);
  }
}

async function deleteS3Config(id) {
  if (!confirm('Xóa cấu hình S3 này?')) return;
  try {
    await api(`/api/admin/s3-configs/${id}`, { method: 'DELETE' });
    showAlert('s3Alert', 'Đã xóa cấu hình S3', 'success');
    loadS3Configs();
  } catch (err) {
    showAlert('s3Alert', err.message);
  }
}
</script>
</body>
</html>
